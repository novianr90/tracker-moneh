name: PR Issue Check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  verify-linked-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Issue Reference in PR Body
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || '';
            const issueRegex = /(?:close|closes|closed|fix|fixes|fixed|resolve|resolves|resolved)\s+#\d+|#\d+/i;
            
            if (!issueRegex.test(body)) {
              core.setFailed('❌ Error: Pull Request MUST reference an issue! (e.g., "Closes #12" or "#12" in PR description)');
            } else {
              console.log('✅ Issue reference found in PR description.');
            }
